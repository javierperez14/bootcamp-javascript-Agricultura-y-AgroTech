<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroTech – Validación Reactiva con Proxy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <span class="logo">🌱</span>
    <div>
      <h1>AgroTech – Registro de Monitoreo</h1>
      <p>Week-10 · Proxy · Reflect · Validación Reactiva · Javier Pérez</p>
    </div>
  </header>

  <main class="container">
    <form id="monitorForm" novalidate>

      <div class="field-group">
        <label for="fieldName">Nombre del lote</label>
        <input id="fieldName" type="text" placeholder="Ej: Lote Norte" />
        <span class="msg" id="fieldName-msg"></span>
      </div>

      <div class="field-group">
        <label for="operator">Operador</label>
        <input id="operator" type="text" placeholder="Nombre del operador" />
        <span class="msg" id="operator-msg"></span>
      </div>

      <div class="field-group">
        <label for="date">Fecha de monitoreo</label>
        <input id="date" type="date" />
        <span class="msg" id="date-msg"></span>
      </div>

      <div class="field-group">
        <label for="humidity">Humedad (%)</label>
        <input id="humidity" type="number" placeholder="0 – 100" />
        <span class="msg" id="humidity-msg"></span>
      </div>

      <div class="field-group">
        <label for="temperature">Temperatura (°C)</label>
        <input id="temperature" type="number" placeholder="-10 – 60" />
        <span class="msg" id="temperature-msg"></span>
      </div>

      <div class="field-group">
        <label for="ph">pH del suelo</label>
        <input id="ph" type="number" step="0.1" placeholder="0 – 14" />
        <span class="msg" id="ph-msg"></span>
      </div>

      <div class="field-group">
        <label for="status">Estado</label>
        <select id="status">
          <option value="">Selecciona…</option>
          <option value="verified">Verificado</option>
          <option value="pending">Pendiente</option>
          <option value="reviewed">Revisado</option>
        </select>
        <span class="msg" id="status-msg"></span>
      </div>

      <button type="submit" id="submitBtn" class="btn" disabled>Registrar Monitoreo</button>
    </form>

    <div id="summary" class="summary hidden">
      <h2>✅ Monitoreo registrado</h2>
      <pre id="summary-data"></pre>
      <button class="btn btn-outline" id="resetBtn">Nuevo registro</button>
    </div>

    <!-- Panel reactivo -->
    <div class="card reactive-panel">
      <h3>🔄 Estado Reactivo (Proxy)</h3>
      <div id="reactive-state" class="state-grid"></div>
    </div>
  </main>

  <script type="module" src="solution/script.js"></script>
</body>
</html>
