<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Modular AgroTech - ES6 Modules</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🌱 Sistema Modular AgroTech</h1>
                <p class="subtitle">Gestión de Equipos Agrícolas con ES6 Modules</p>
                <div class="stats" id="stats">
                    <div class="stat-card">
                        <span class="stat-value" id="totalItems">0</span>
                        <span class="stat-label">Total Equipos</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="activeItems">0</span>
                        <span class="stat-label">Activos</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="totalValue">$0</span>
                        <span class="stat-label">Valor Total</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Formulario -->
                <div class="form-section">
                    <h2>Agregar Equipo</h2>
                    <form id="equipmentForm">
                        <div class="form-group">
                            <label for="name">Nombre</label>
                            <input type="text" id="name" required placeholder="Ej: Tractor John Deere">
                        </div>

                        <div class="form-group">
                            <label for="category">Categoría</label>
                            <select id="category" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="value">Valor ($)</label>
                            <input type="number" id="value" required min="0" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="location">Ubicación</label>
                            <input type="text" id="location" required placeholder="Ej: Sector A">
                        </div>

                        <div class="form-group">
                            <label for="quantity">Cantidad</label>
                            <input type="number" id="quantity" required min="1" value="1">
                        </div>

                        <div class="form-group">
                            <label for="minStock">Stock Mínimo</label>
                            <input type="number" id="minStock" required min="0" value="1">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <span id="formButtonText">Agregar Equipo</span>
                        </button>
                        <button type="button" id="cancelEdit" class="btn btn-secondary" style="display: none;">
                            Cancelar
                        </button>
                    </form>
                </div>

                <!-- Filtros -->
                <div class="filters-section">
                    <h3>Filtros</h3>
                    <div class="form-group">
                        <label for="filterCategory">Por Categoría</label>
                        <select id="filterCategory">
                            <option value="">Todas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filterStatus">Por Estado</label>
                        <select id="filterStatus">
                            <option value="">Todos</option>
                            <option value="active">Activos</option>
                            <option value="inactive">Inactivos</option>
                            <option value="lowStock">Stock Bajo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="searchQuery">Buscar</label>
                        <input type="text" id="searchQuery" placeholder="Buscar por nombre...">
                    </div>
                </div>

                <!-- Acciones -->
                <div class="actions-section">
                    <h3>Acciones</h3>
                    <button id="reportsBtn" class="btn btn-secondary btn-block">
                        📊 Ver Reportes
                    </button>
                    <button id="exportBtn" class="btn btn-secondary btn-block">
                        📥 Exportar Datos
                    </button>
                </div>
            </aside>

            <!-- Lista de equipos -->
            <main class="content">
                <div class="content-header">
                    <h2>Equipos Registrados</h2>
                </div>
                <div id="equipmentList" class="equipment-grid"></div>
            </main>
        </div>
    </div>

    <!-- Modal de reportes -->
    <div id="reportsModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeReports">&times;</span>
            <h2>📊 Reportes y Estadísticas</h2>
            <div id="reportsContent"></div>
        </div>
    </div>

    <script type="module" src="starter/main.js"></script>
</body>
</html>
